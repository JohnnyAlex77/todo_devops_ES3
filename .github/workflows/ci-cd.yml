name: CI/CD ES3 - Pruebas y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Pruebas de aplicación y seguridad
  # ==========================================
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias (Jest)
        run: npm test

      - name: Lint
        run: npm run lint

      # ---- Escaneo de seguridad de infraestructura ----
      - name: Escaneo de seguridad Terraform (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          output_format: cli
          soft_fail: true   # No detiene el pipeline si hay hallazgos
          compact: true

      # ---- Validación de Terraform ----
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infra/

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/

  # ==========================================
  # JOB 2: Deploy (solo si las pruebas pasan y es push a main)
  # ==========================================
  deploy:
    needs: test-and-security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infra/

      - name: Terraform Plan
        run: terraform plan -var="alert_email=${{ secrets.ALERT_EMAIL }}" -var="my_ip=${{ secrets.MY_IP }}"
        working-directory: infra/

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="alert_email=${{ secrets.ALERT_EMAIL }}" -var="my_ip=${{ secrets.MY_IP }}"
        working-directory: infra/